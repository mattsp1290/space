[package]
name = "space-scan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "deny"

[dependencies]
space-core = { path = "../space-core" }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_IO", "Win32_System_Ioctl"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
sysinfo = { version = "=0.31.4", default-features = false, features = ["disk"] }
